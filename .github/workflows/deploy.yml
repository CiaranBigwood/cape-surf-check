name: Build and publish

# Rebuilds the page with a fresh forecast every 3 hours, and whenever something is pushed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site with a fresh forecast
        run: |
          python3 build.py \
            --public-url "${{ steps.pages.outputs.base_url }}/" \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --previous "${{ steps.pages.outputs.base_url }}/forecast.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows in repositories with no activity for 60 days.
  # Re-enabling the workflow on each scheduled run keeps the 3-hourly refresh going.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    continue-on-error: true
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
